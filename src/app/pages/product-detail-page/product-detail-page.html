<main class="min-h-screen bg-gray-100 py-6">
  <div class="mx-auto max-w-7xl">
    <div role="tablist" class="flex items-end gap-1 sm:gap-2">
      @for (product of products(); track product.id) {
        @let isActive = selectedProduct()?.id === product.id;
        <button
          type="button"
          role="tab"
          [attr.aria-selected]="isActive"
          (click)="selectProduct(product.id)"
          class="relative flex flex-1 min-w-0 items-center gap-2 sm:gap-3 rounded-t-xl px-2 sm:px-5 text-sm sm:text-base font-semibold transition-all sm:flex-none"
          [class]="isActive
            ? 'bg-white text-gray-900 py-3 sm:py-4 shadow-[0_-4px_12px_-4px_rgba(0,0,0,0.08)] z-10 -mb-2 pb-5 sm:pb-6'
            : 'bg-gray-200 text-gray-600 py-2 sm:py-3 hover:bg-gray-300 hover:text-gray-800'"
        >
          <span
            class="h-8 w-8 sm:h-10 sm:w-10 shrink-0 rounded-md ring-1 ring-gray-200 flex items-center justify-center overflow-hidden"
            [class]="isActive ? 'bg-gray-200' : 'bg-gray-300'"
          >
            <img
              [src]="product.images[0]"
              [alt]="product.name"
              class="h-full w-full object-cover"
              onerror="this.style.display='none'"
            />
          </span>
          <span class="truncate text-left">{{ product.name }}</span>
        </button>
      }
    </div>

    <div class="rounded-lg rounded-tl-none bg-white p-4 sm:p-6 shadow-sm">
      @if (selectedProduct(); as product) {
        <div class="grid grid-cols-1 gap-6 lg:grid-cols-[minmax(0,560px)_minmax(0,1fr)_360px]">
          <app-product-gallery [product]="product" />
          <app-product-info [product]="product" />
          <app-purchase-panel [product]="product" />
        </div>
      } @else {
        <p class="text-sm text-gray-500">Cargando producto…</p>
      }
    </div>
  </div>
</main>
