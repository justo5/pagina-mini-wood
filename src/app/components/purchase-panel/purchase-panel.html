<aside class="flex w-full flex-col gap-3 self-center rounded-lg border border-gray-200 bg-white p-5 text-sm text-gray-800 shadow-sm">
  @if (product().shipping.freeDelivery; as freeDelivery) {
    <div>
      <p class="font-semibold text-green-700">{{ freeDelivery.text }}</p>
      <a class="text-xs text-blue-600 hover:underline cursor-pointer">{{ freeDelivery.linkText }}</a>
    </div>
  }

  @if (product().shipping.pickup; as pickup) {
    <div>
      <p class="text-gray-700">
        <span class="font-semibold text-green-700">{{ pickup.label }}</span>
        {{ pickup.description }}
      </p>
      <a class="text-xs text-blue-600 hover:underline cursor-pointer">{{ pickup.linkText }}</a>
    </div>
  }



  <a
    href="https://wa.me/5491144407562?text=Hola!%20V%C3%AD%20la%20publicidad%20y%20me%20gustar%C3%ADa%20saber%20m%C3%A1s%20sobre%20los%20productos%20montessor"
    target="_blank"
    rel="noopener noreferrer"
    class="mt-1 rounded-md bg-blue-500 px-4 py-2.5 text-sm font-medium text-white hover:bg-blue-600 text-center"
  >
    Contactanos por WhatsApp
  </a>
</aside>
