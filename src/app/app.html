<header class="app-header">
  @if (site(); as siteConfig) {
    <img
      class="app-header__logo"
      [src]="siteConfig.logo"
      [alt]="siteConfig.name"
    />
  } @else {
    <div class="app-header__logo">Logo</div>
  }

  <a
    [href]="site()?.social?.whatsapp"
    target="_blank"
    rel="noopener noreferrer"
    (click)="trackContact()"
    class="ml-auto hidden rounded-md bg-blue-500 px-4 py-2.5 text-sm font-medium text-white hover:bg-blue-600 md:inline-block"
  >
    Contactanos por WhatsApp
  </a>
</header>

<app-product-detail-page />
